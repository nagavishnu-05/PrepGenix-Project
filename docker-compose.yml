version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: interview-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - interview-network

  # Backend (Express + Node.js)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: interview-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/interview_assessment?authSource=admin
      JWT_SECRET: your_jwt_secret_key_here
      AIML_API_URL: http://aiml:5000
    depends_on:
      - mongodb
    volumes:
      - ./Backend:/app
      - /app/node_modules
    networks:
      - interview-network
    command: npm run dev

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: interview-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_AIML_API_URL: http://localhost:5000
      VITE_PROCTORING_API: http://localhost:5050
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    networks:
      - interview-network
    command: npm run dev

  # AIML (Python + Flask)
  aiml:
    build:
      context: ./AIML
      dockerfile: Dockerfile
    container_name: interview-aiml
    restart: always
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 5000
      BACKEND_API_URL: http://backend:3000
    depends_on:
      - backend
    volumes:
      - ./AIML:/app
      - /app/__pycache__
    networks:
      - interview-network
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--worker-class", "gthread", "--threads", "4", "server:app"]

  # Stateful Python proctoring API. Keep it in one process so enrollment and
  # temporal violation state remain consistent between monitor requests.
  proctoring:
    build:
      context: ./AIML
      dockerfile: Dockerfile
    container_name: interview-proctoring
    restart: always
    ports:
      - "5050:5050"
    environment:
      FLASK_ENV: production
      PROCTORING_PORT: 5050
    volumes:
      - ./AIML:/app
      - /app/__pycache__
    networks:
      - interview-network
    command: ["gunicorn", "--bind", "0.0.0.0:5050", "--workers", "1", "--worker-class", "gthread", "--threads", "4", "api.proctoring_api:app"]

volumes:
  mongodb_data:

networks:
  interview-network:
    driver: bridge
