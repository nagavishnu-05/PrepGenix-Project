version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: interview-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - interview-network

  # Backend (Express + Node.js)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: interview-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/interview_assessment?authSource=admin
      JWT_SECRET: your_jwt_secret_key_here
      AIML_API_URL: http://aiml:5000
    depends_on:
      - mongodb
    volumes:
      - ./Backend:/app
      - /app/node_modules
    networks:
      - interview-network
    command: npm run dev

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: interview-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3000
      VITE_AIML_API_URL: http://localhost:5000
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    networks:
      - interview-network
    command: npm run dev

  # AIML (Python + Flask)
  aiml:
    build:
      context: ./AIML
      dockerfile: Dockerfile
    container_name: interview-aiml
    restart: always
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 5000
      BACKEND_API_URL: http://backend:3000
    depends_on:
      - backend
    volumes:
      - ./AIML:/app
      - /app/__pycache__
    networks:
      - interview-network

volumes:
  mongodb_data:

networks:
  interview-network:
    driver: bridge
